# Production-style stack: the app image plus Postgres. Use it to rehearse a deploy on your own machine:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up --build
# On Coolify you can instead deploy the Dockerfile and attach Coolify's managed PostgreSQL (see docs/DEPLOY.md).
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      SITE_URL: ${SITE_URL:?Set SITE_URL, e.g. https://searchdistributor.online}
      DATABASE_URL: postgresql://distributor:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/search_distributor?schema=public
      SHOW_DEMO_DATA: "false"
      ENQUIRY_EMAIL_VERIFICATION: ${ENQUIRY_EMAIL_VERIFICATION:-true}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
      SITE_NAME: ${SITE_NAME:-Search Distributor}
      # S3-compatible object storage. MEDIA_PUBLIC_URL is the URL browsers use,
      # while MEDIA_ENDPOINT is the private S3 API endpoint used by the server.
      MEDIA_BUCKET: ${MEDIA_BUCKET:-}
      MEDIA_REGION: ${MEDIA_REGION:-auto}
      MEDIA_ENDPOINT: ${MEDIA_ENDPOINT:-}
      MEDIA_ACCESS_KEY_ID: ${MEDIA_ACCESS_KEY_ID:-}
      MEDIA_SECRET_ACCESS_KEY: ${MEDIA_SECRET_ACCESS_KEY:-}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
    ports:
      - "${APP_PORT:-3000}:3000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: distributor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: search_distributor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distributor -d search_distributor"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
