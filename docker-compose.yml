services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: distributor
      POSTGRES_PASSWORD: distributor
      POSTGRES_DB: search_distributor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distributor -d search_distributor"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
